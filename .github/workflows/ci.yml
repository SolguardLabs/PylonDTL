name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          c++ --version
          g++ --version
      - name: CI
        run: bash scripts/ci.sh
