name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: CI
        run: bash scripts/ci.sh
